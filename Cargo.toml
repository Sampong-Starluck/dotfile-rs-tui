[package]
name = "rust-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.3"
ratatui = "0.30.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
which = "8.0.2"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true