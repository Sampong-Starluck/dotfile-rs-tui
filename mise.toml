[tools]
# GraalVM JDK 25
java = "oracle-graalvm-25"
maven = "3.9"

[env]
# Panama FFM backend performs native downcalls — required on JDK 24+
JAVA_TOOL_OPTIONS = "--enable-native-access=ALL-UNNAMED"

[tasks.dev]
run = "mvn clean install && java --enable-native-access=ALL-UNNAMED -jar .\\target\\dotfile-java-tui-0.1.0.jar"
description = "Run the TUI in dev mode"

[tasks.test]
run = "mvn -q test"

[tasks.build]
run = "mvn -q clean package"

[tasks.native]
run = "mvn -Pnative clean native:compile"
description = "GraalVM native image (Phase 11)"

[tasks.native-instrument]
run = "mvn -q -Pnative -Dnative.imageName=dotfile-java-tui-sampling -Dnative.pgoArg=--pgo-sampling clean native:compile"
description = "PGO step 1: build target/dotfile-java-tui-sampling.exe (uses --pgo-sampling, not --pgo-instrument -- see pom.xml comment). Run it in a real Windows Terminal, exercise the app, then quit — it writes default.iprof to the working directory."

[tasks.native-pgo]
run = "mvn -q -Pnative -Dnative.pgoArg=--pgo=default.iprof clean native:compile"
description = "PGO step 2: rebuild target/dotfile-java-tui.exe using default.iprof (run native-instrument and exercise the sampling exe first — native-image errors clearly if the file is missing)."
